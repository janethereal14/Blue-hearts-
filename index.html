<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Hearts Aesthetic</title>
    <style>
        /* Base Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Black Background */
            color: #0080ff; /* Blue Text */
            font-family: 'Times New Roman', Times, serif;
            overflow-x: hidden;
            min-height: 200vh; /* Extra height for scrolling */
        }

        /* Heart Container */
        #heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            color: #00c3ff;
            font-size: 20px;
            user-select: none;
            animation: fall 5s linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0; /* Fading as they fall */
            }
        }

        /* Text Content */
        .content {
            position: relative;
            z-index: 1;
            padding: 50px;
            max-width: 800px;
            margin: auto;
        }

        .para {
            margin-bottom: 400px; /* Space to allow scrolling reveal */
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease-out;
            font-size: 1.5rem;
            line-height: 1.6;
        }

        .para.visible {
            opacity: 1;
        }

        .char {
            display: inline-block;
            visibility: hidden;
        }

        .char.typed {
            visibility: visible;
        }
    </style>
</head>
<body>

    <div id="heart-container"></div>

    <div class="content">
        <div class="para" data-text="Welcome to my blue project."></div>
        <div class="para" data-text="I hope it turns out really good as I have expected. And this is going to the the first one that i have done properly if it works out...."></div>
        <div class="para" data-text="Hi mummy! How ya doing? \n isn't this fun huh? ."></div>
        <div class="para" data-text="If you like this magic of mine, please send a 💙, and say your thoughts! Hope you like it!!!"></div>
    </div>

    <script>
        // 1. Falling Hearts Logic
        function createHeart() {
            const container = document.getElementById('heart-container');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '💙';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's'; // 2-5 seconds
            
            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 300);

        // 2. Typewriter & Scroll Logic
        const paragraphs = document.querySelectorAll('.para');

        const observerOptions = {
            threshold: 0.5
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !entry.target.classList.contains('animated')) {
                    entry.target.classList.add('visible', 'animated');
                    typeEffect(entry.target);
                }
            });
        }, observerOptions);

        paragraphs.forEach(p => {
            // Wrap each character in a span
            const text = p.getAttribute('data-text');
            p.innerHTML = text.split('').map(char => `<span class="char">${char}</span>`).join('');
            observer.observe(p);
        });

        function typeEffect(element) {
            const chars = element.querySelectorAll('.char');
            chars.forEach((char, index) => {
                setTimeout(() => {
                    char.classList.add('typed');
                }, index * 50); // Speed of typing
            });
        }
    </script>
</body>
  </html>
